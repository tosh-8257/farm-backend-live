services:
  - type: web
    name: farm-backend
    runtime: node
    plan: starter
    dir: .

    buildCommand: npm ci && npm run build

    startCommand: bash ./start.sh
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: "3000"
      
      # Database connection - get from PostgreSQL service or external DB
      - key: DATABASE_URL
        fromDatabase:
          name: farm-db
          property: connectionString
      
      # Redis URL - get from Redis service or use external Redis
      - key: REDIS_URL
        sync: false

      - key: WEB_CONCURRENCY
        value: "2"

      - key: CACHE_TTL_SECONDS
        value: "60"
      
      # CORS configuration
      - key: CORS_ORIGINS
        # Replace with your Cloudflare origin(s), comma-separated if multiple.
        value: https://*.algorandfarm686.workers.dev
      
      # Paystack Configuration
      - key: PAYSTACK_SECRET_KEY
        sync: false
      
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      
      # Ivorypay Configuration
      - key: IVORYPAY_API_KEY
        sync: false
      
      - key: IVORYPAY_BASE_URL
        value: https://api.ivorypay.io
      
      # JWT Configuration
      # Must match the name the code reads (JwtStrategy / AuthService).
      - key: JWT_ACCESS_SECRET
        sync: false
      
      - key: JWT_EXPIRATION
        value: 3600
      
      - key: JWT_REFRESH_SECRET
        sync: false
      
      - key: JWT_REFRESH_EXPIRATION
        value: 604800
      
      # Refresh-session lifetime in days (rotated on each refresh; 1-365)
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      
      # Cloudinary Configuration
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      
      - key: CLOUDINARY_API_KEY
        sync: false
      
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # AWS Secrets Manager (optional)
      - key: AWS_REGION
        value: us-east-1
      
      - key: AWS_ACCESS_KEY_ID
        sync: false
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Secrets required by the code (production validation / webhooks / KYC).
      - key: QR_HMAC_SECRET
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_EMAIL
        sync: false
      - key: NOWPAYMENTS_PASSWORD
        sync: false
      - key: NOWPAYMENTS_PAYOUT_IPN_CALLBACK_URL
        sync: false
      - key: NOWPAYMENTS_2FA_SECRET
        sync: false
      - key: WITHDRAWAL_DAILY_MAX_COUNT
        value: "5"
      - key: WITHDRAWAL_DAILY_MAX_AMOUNT
        value: "1000000"
      - key: CRYPTO_WITHDRAWAL_MAX_USD
        value: "100000"
      - key: CRYPTO_WITHDRAWAL_DAILY_MAX_USD
        value: "1000000"
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_SESSION_URL
        sync: false
